name: Update Tide JSON

on:
  schedule:
    - cron: '5 0 * * *' # S'exécute chaque nuit à 00h05 UTC
  workflow_dispatch: # Déclenchement manuel

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Tide Data for json
        env:
          API_KEY_MAREE: ${{ secrets.API_KEY_MAREE }}
        run: node update_json.js

      - name: Fetch Tide Data for table
        env:
          API_KEY_MAREE: ${{ secrets.API_KEY_MAREE }}
        run: node update_table.js

      - name: Commit & Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add maree.json maree_table_J0.json maree_table_J1.json
          git commit -m "Update JSON file by Robot Action" || exit 0
          git pull --rebase origin main
          git push
