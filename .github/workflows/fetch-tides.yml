name: Update Tide JSON

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v20

      - name: Fetch Tide Data
        env:
          API_KEY_MAREE: ${{ secrets.API_KEY_MAREE }}
        run: node update.js

      - name: Commit & Push JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update maree.json [skip ci]"
          file_pattern: "maree.json"
